name: Bug report
description: Report a PotatoVoxel bug. The structured fields let automated tooling pick the right diagnostics and fixes.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Fill in the required fields. Exact values get this triaged and fixed automatically.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which gen1recomp build are you on?
      options:
        - Nintendo Switch
        - Android
        - Windows
        - macOS
        - Linux (desktop)
        - TrimUI Brick / Linux handheld
        - Other
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      description: Device model and RAM, if known.
      placeholder: e.g. Switch OLED, Galaxy A53 4GB
  - type: input
    id: engine
    attributes:
      label: Engine version
      description: The buildVersion from lua-error.log, or the launcher/release version.
      placeholder: e.g. 0.1.75
  - type: input
    id: mod-version
    attributes:
      label: PotatoVoxel version
      description: The mod version shown in the mod manager or manifest.json.
      placeholder: e.g. 1.3.7
    validations:
      required: true
  - type: dropdown
    id: symptom
    attributes:
      label: What happens?
      description: Pick the closest category.
      options:
        - Crash / app closes or restarts
        - Cache build fails or never completes
        - Launcher or update issue
        - Visual glitch
        - Hitch / performance problem
        - Other
    validations:
      required: true
  - type: dropdown
    id: cache
    attributes:
      label: Involves the mesh cache?
      options:
        - Yes — PREBUILD CACHE build
        - Yes — loading / moving between maps
        - No
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Newest error-log block
      description: |
        Paste the NEWEST block from lua-error.log (on Switch, switch.log). It lives at
        `<save dir>/pokemon-love2d/lua-error.log` on desktop/Android. The last block is the
        newest; a stale block from an old crash is not useful.
      render: text
      placeholder: |
        [2026-08-11T12:00:00Z] path/to/file.lua:NN: message
        gitCommit=... buildVersion=... os=...
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps, one per line. Include settings you changed (VOXEL level, cache actions).
      render: text
      placeholder: |
        1. Enable VOXEL
        2. Open OPTIONS -> VOXEL SETTINGS
        3. Run PREBUILD CACHE
        4. ...
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: Expected behaviour
      description: What should happen instead?
      placeholder: e.g. The cache builds and READY is shown.
    validations:
      required: true
  - type: dropdown
    id: reproducibility
    attributes:
      label: Reproducibility
      options:
        - Always
        - Sometimes
        - Once
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I am on the latest PotatoVoxel release.
        - label: I included the newest error-log block, not an old one.
